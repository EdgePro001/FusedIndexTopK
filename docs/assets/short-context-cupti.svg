<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Short-context H20 CUPTI latency</title>
  <desc id="desc">Line chart comparing FusedIndexTopK with DeepGEMM plus FlashInfer and DeepGEMM plus torch.topk from 6144 to 16384 context tokens. Lower latency is better.</desc>
  <rect width="1000" height="540" rx="20" fill="#0b1020"/>

  <text x="54" y="48" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Short-context H20 latency</text>
  <text x="54" y="76" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">CUPTI kernel sum · Q=4096 · K=2048 · median across 5 layers × 2 held-out splits · lower is better</text>

  <g stroke="#253047" stroke-width="1">
    <line x1="100" y1="420" x2="920" y2="420"/>
    <line x1="100" y1="366.7" x2="920" y2="366.7"/>
    <line x1="100" y1="313.3" x2="920" y2="313.3"/>
    <line x1="100" y1="260" x2="920" y2="260"/>
    <line x1="100" y1="206.7" x2="920" y2="206.7"/>
    <line x1="100" y1="153.3" x2="920" y2="153.3"/>
    <line x1="100" y1="100" x2="920" y2="100"/>
  </g>

  <g fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="end">
    <text x="88" y="424">0</text>
    <text x="88" y="370.7">1</text>
    <text x="88" y="317.3">2</text>
    <text x="88" y="264">3</text>
    <text x="88" y="210.7">4</text>
    <text x="88" y="157.3">5</text>
    <text x="88" y="104">6 ms</text>
  </g>

  <g fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="160" y="448">6,144</text>
    <text x="390" y="448">8,192</text>
    <text x="620" y="448">12,288</text>
    <text x="850" y="448">16,384</text>
    <text x="505" y="472" fill="#94a3b8">context tokens (N)</text>
  </g>

  <polyline points="160,347.6 390,319.6 620,266.2 850,212.3" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,330.8 390,300.7 620,242.1 850,183.4" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,312.4 390,275.7 620,202.1 850,129.0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#0b1020" stroke-width="3">
    <circle cx="160" cy="347.6" r="5" stroke="#4ade80"/><circle cx="390" cy="319.6" r="5" stroke="#4ade80"/><circle cx="620" cy="266.2" r="5" stroke="#4ade80"/><circle cx="850" cy="212.3" r="5" stroke="#4ade80"/>
    <circle cx="160" cy="330.8" r="5" stroke="#60a5fa"/><circle cx="390" cy="300.7" r="5" stroke="#60a5fa"/><circle cx="620" cy="242.1" r="5" stroke="#60a5fa"/><circle cx="850" cy="183.4" r="5" stroke="#60a5fa"/>
    <circle cx="160" cy="312.4" r="5" stroke="#f59e0b"/><circle cx="390" cy="275.7" r="5" stroke="#f59e0b"/><circle cx="620" cy="202.1" r="5" stroke="#f59e0b"/><circle cx="850" cy="129.0" r="5" stroke="#f59e0b"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">
    <text x="160" y="365" fill="#4ade80" text-anchor="middle">1.357</text>
    <text x="390" y="337" fill="#4ade80" text-anchor="middle">1.882</text>
    <text x="620" y="284" fill="#4ade80" text-anchor="middle">2.884</text>
    <text x="850" y="230" fill="#4ade80" text-anchor="middle">3.894</text>
    <text x="160" y="321" fill="#60a5fa" text-anchor="middle">1.673</text>
    <text x="390" y="291" fill="#60a5fa" text-anchor="middle">2.236</text>
    <text x="620" y="232" fill="#60a5fa" text-anchor="middle">3.336</text>
    <text x="850" y="173" fill="#60a5fa" text-anchor="middle">4.436</text>
    <text x="160" y="302" fill="#f59e0b" text-anchor="middle">2.017</text>
    <text x="390" y="266" fill="#f59e0b" text-anchor="middle">2.705</text>
    <text x="620" y="192" fill="#f59e0b" text-anchor="middle">4.085</text>
    <text x="850" y="119" fill="#f59e0b" text-anchor="middle">5.456</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
    <line x1="110" y1="505" x2="140" y2="505" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="510" fill="#e2e8f0">FusedIndexTopK</text>
    <line x1="326" y1="505" x2="356" y2="505" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <text x="366" y="510" fill="#e2e8f0">DeepGEMM + FlashInfer</text>
    <line x1="642" y1="505" x2="672" y2="505" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <text x="682" y="510" fill="#e2e8f0">DeepGEMM + torch.topk</text>
  </g>
</svg>
