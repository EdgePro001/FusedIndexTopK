[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fused-index-topk"
version = "0.2.0"
description = "DeepGEMM-style fused Indexer and exact Top-K kernels for DeepSeek V3.2 sparse attention"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
fused-index-topk = "fused_index_topk.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.12"]

[project.entry-points."fused_index_topk.variants"]
deepgemm_torch_unfused = "fused_index_topk.variants.deepgemm_torch:create_variant"
deepgemm_deepselect_topk = "fused_index_topk.variants.deepgemm_deepselect.plugin:create_variant"
fused_index_topk = "fused_index_topk.kernel.plugin:create_variant"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fused_index_topk = [
  "kernel/**/*.cpp",
  "kernel/**/*.cu",
  "kernel/**/*.cuh",
  "kernel/**/*.hpp",
  "variants/**/*.cu",
  "variants/**/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
